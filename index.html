<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHOTO-MATIC · SAY CHEESE!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=VT323&family=Noto+Sans+TC:wght@500;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f3ead7; --paper:#fffaf0; --ink:#161616;
  --red:#d7263d; --navy:#1b2a4a; --mustard:#f2b134; --pink:#f6b8cb;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;
  background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:14px 14px}
.checker{height:18px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--paper) 0 50%) 0 0/18px 18px;border-bottom:3px solid var(--ink)}
main{flex:1;width:100%;max-width:520px;margin:0 auto;padding:14px 16px 24px}
.screen{display:none}
.screen.active{display:block;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:3px solid var(--ink);border-radius:14px;background:var(--red);color:#fff;
  font-weight:900;font-size:18px;padding:14px;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;letter-spacing:.05em}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.big{font-size:21px;padding:17px}
.btn.alt{background:var(--navy)}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.wait{background:#9a9a9a}
.btn[hidden]{display:none}
.btn + .btn{margin-top:12px}
.note{text-align:center;font-size:13px;opacity:.65;margin-top:12px;line-height:1.6}

/* 招牌 */
.sign{background:var(--red);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);
  padding:18px 14px 16px;text-align:center;color:var(--paper);position:relative;margin:6px 4px 22px}
.sign::before{content:"";position:absolute;inset:7px;border-radius:15px;pointer-events:none;
  background:radial-gradient(circle,#ffe9a8 0 3px,transparent 3.5px) 0 0/18px 18px;
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);padding:6px;opacity:.95}
.sign h1{font-family:"Archivo Black",sans-serif;font-size:54px;line-height:.95;letter-spacing:.02em;
  text-shadow:4px 4px 0 var(--ink);color:var(--paper);margin:6px 0}
.sign-sub{font-family:"Archivo Black",sans-serif;font-size:15px;letter-spacing:.2em;color:#ffe9a8}
.sign-foot{font-family:"Archivo Black",sans-serif;font-size:11px;letter-spacing:.18em;opacity:.9}
.step{font-weight:900;font-size:18px;margin:0 0 10px 2px}
.step::before{content:"★ ";color:var(--red)}
.layouts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.layout-card{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px 6px 10px;
  box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px}
.layout-card.on{background:var(--mustard);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.layout-card b{font-size:15px}
.layout-card small{font-size:12px;opacity:.7}
.mini{height:84px;display:grid;gap:3px;padding:4px;background:var(--ink);border-radius:4px}
.mini i{background:linear-gradient(160deg,#c39a6b,#7d5634);border-radius:1px}
.mini-strip{width:34px;grid-template-rows:repeat(4,1fr)}
.mini-grid{width:58px;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;height:80px}
.mini-single{width:60px;padding:4px 4px 16px;background:var(--paper);border:2px solid var(--ink)}

/* 拍照 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.topbar .title{font-weight:900;font-size:18px}
.icon-btn{width:42px;height:42px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);
  font-size:20px;font-weight:900;box-shadow:2px 2px 0 var(--ink);flex:none}
.dots{display:flex;gap:6px}
.dots span{width:30px;height:30px;border:3px solid var(--ink);border-radius:50%;display:grid;place-items:center;
  font-family:"Archivo Black";font-size:13px;background:var(--paper)}
.dots span.done{background:var(--mustard)}
.dots span.now{background:var(--red);color:#fff}
.booth{background:var(--navy);border:3px solid var(--ink);border-radius:20px;padding:12px;box-shadow:5px 5px 0 var(--ink)}
.pv-wrap{position:relative;margin:0 auto;width:fit-content;max-width:100%;border-radius:8px;overflow:hidden;background:#000;line-height:0}
#out{display:block;max-width:100%;max-height:48vh;width:auto;height:auto}
.pv-msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;line-height:1.6;
  color:#fff;font-weight:900;font-size:16px;background:rgba(10,14,30,.55)}
.pv-msg.on{display:grid}
.pv-msg .spin{width:34px;height:34px;border:4px solid rgba(255,255,255,.3);border-top-color:var(--mustard);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.countdown{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:"Archivo Black";
  font-size:120px;color:#fff;text-shadow:5px 5px 0 var(--red),0 0 30px rgba(0,0,0,.4);line-height:1}
.countdown.tick{animation:tick 1s ease-out}
@keyframes tick{0%{transform:scale(1.6);opacity:0}15%{transform:scale(1);opacity:1}85%{opacity:1}100%{opacity:.2}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.rec{position:absolute;top:10px;left:10px;font:900 12px "Archivo Black";color:#fff;background:var(--red);
  padding:4px 8px;border-radius:6px;line-height:1;opacity:0}
.rec.on{opacity:1;animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tabs{display:flex;gap:6px;margin:16px 0 8px}
.tabs button{flex:1;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:8px 0;font-weight:900;font-size:15px}
.tabs button.on{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:3px solid var(--ink);border-radius:12px;background:var(--paper);padding:6px;font-weight:900;font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px}
.chip canvas,.chip .sw{width:58px;height:44px;border-radius:6px;border:2px solid var(--ink);display:block}
.chip.on{background:var(--mustard);box-shadow:inset 0 0 0 2px var(--ink)}
.chip.txt{padding:10px 14px;min-width:0}
.thumbs{display:flex;gap:8px;justify-content:center;margin:8px 0 4px;flex-wrap:wrap}
.thumb{width:62px;height:62px;border:3px dashed rgba(0,0,0,.35);border-radius:10px;background:transparent;overflow:hidden;padding:0;
  display:grid;place-items:center;font-family:"Archivo Black";font-size:18px;color:rgba(0,0,0,.3)}
.thumb.filled{border:3px solid var(--ink)}
.thumb.sel{outline:4px solid var(--red);outline-offset:2px}
.thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.hint{text-align:center;font-size:13px;opacity:.7;min-height:20px;margin-bottom:10px}

/* 裝飾 */
.stage-wrap{display:flex;justify-content:center;margin-bottom:10px}
.stage{position:relative;box-shadow:5px 5px 0 var(--ink);border:3px solid var(--ink);border-radius:4px;overflow:hidden;background:#fff}
#decoCanvas{display:block;width:100%;height:100%}
.sticker-layer{position:absolute;inset:0;touch-action:none}
.stk{position:absolute;image-rendering:pixelated;touch-action:none;user-select:none;-webkit-user-drag:none;cursor:grab}
.stk.sel{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 2px var(--red)) drop-shadow(0 0 2px var(--red))}
.sel-tools{display:flex;gap:6px;justify-content:center;margin:4px 0 10px}
.sel-tools[hidden]{display:none}
.sel-tools button{border:3px solid var(--ink);border-radius:10px;background:var(--paper);padding:6px 12px;font-weight:900;font-size:14px;box-shadow:2px 2px 0 var(--ink)}
.sel-tools button.del{background:var(--red);color:#fff}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:var(--radius);padding:14px;margin-bottom:16px;box-shadow:4px 4px 0 var(--ink)}
.panel h3{font-size:15px;font-weight:900;margin:2px 0 8px;display:flex;align-items:center;gap:8px}
.panel h3 small{font-weight:500;opacity:.6;font-size:12px}
.panel h3:not(:first-child){margin-top:14px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink)}
.swatch.on{outline:3px solid var(--red);outline-offset:3px}
.switch{position:relative;width:48px;height:28px;display:inline-block;margin-left:auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#ccc;border:3px solid var(--ink);border-radius:20px;transition:.2s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border:2px solid var(--ink);border-radius:50%;transition:.2s}
.switch input:checked + span{background:var(--mustard)}
.switch input:checked + span::after{transform:translateX(19px)}
.sticker-tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.sticker-tray button{aspect-ratio:1;min-width:0;border:2px solid var(--ink);border-radius:10px;background:#fff;display:grid;place-items:center;padding:6px}
.sticker-tray img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}

/* 沖洗 */
#develop{text-align:center;padding-top:30px}
.machine{width:220px;height:170px;margin:0 auto 24px;background:var(--red);border:3px solid var(--ink);border-radius:18px;position:relative;box-shadow:5px 5px 0 var(--ink)}
.machine::before{content:"PHOTO";position:absolute;top:18px;left:0;right:0;font-family:"Archivo Black";color:var(--paper);font-size:26px;letter-spacing:.1em;text-shadow:3px 3px 0 var(--ink)}
.slot{position:absolute;left:40px;right:40px;bottom:30px;height:12px;background:var(--ink);border-radius:6px}
.paper{position:absolute;left:58px;right:58px;top:136px;height:0;background:var(--paper);border:3px solid var(--ink);border-top:none;animation:print 2.4s ease-in-out infinite}
@keyframes print{0%{height:0}70%{height:70px}100%{height:70px;opacity:0}}
#devText{font-weight:900;font-size:19px;margin:70px 0 14px}
.bar{height:20px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);overflow:hidden;margin:0 20px 10px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--mustard) 0 10px,#f7c95c 10px 20px);transition:width .2s}

/* 結果 */
#result h2{font-family:"Archivo Black";font-size:34px;text-align:center;text-shadow:3px 3px 0 var(--mustard);margin:4px 0 12px}
.seg{display:flex;width:200px;margin:0 auto 12px;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--paper);padding:8px;font-weight:900}
.seg button.on{background:var(--ink);color:var(--paper)}
.result-view{display:flex;justify-content:center;margin-bottom:18px}
.result-view [hidden]{display:none!important}
.result-view video,.result-view img{max-width:100%;max-height:60vh;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);display:block;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;font-weight:900;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
footer{text-align:center;font-size:12px;opacity:.6;padding:10px 0 calc(env(safe-area-inset-bottom) + 10px);font-family:"Archivo Black";letter-spacing:.1em}
#cam{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
</style>
</head>
<body>
<div class="checker"></div>
<main>
  <!-- 首頁 -->
  <section class="screen active" id="home">
    <div class="sign">
      <div class="sign-sub">★ PHOTO-MATIC ★</div>
      <h1>SAY<br>CHEESE!</h1>
      <div class="sign-foot">4 SHOTS · LIVE · PRINT</div>
    </div>
    <h2 class="step">選一種相紙</h2>
    <div class="layouts">
      <button class="layout-card on" data-layout="strip"><div class="mini mini-strip"><i></i><i></i><i></i><i></i></div><b>經典直條</b><small>連拍 4 張</small></button>
      <button class="layout-card" data-layout="grid"><div class="mini mini-grid"><i></i><i></i><i></i><i></i></div><b>四宮格</b><small>連拍 4 張</small></button>
      <button class="layout-card" data-layout="single"><div class="mini mini-single"><i></i></div><b>拍立得</b><small>只拍 1 張</small></button>
    </div>
    <button class="btn big" id="startBtn">投幣開始 ▶</button>
    <p class="note">每張照片都會順便錄一小段動態。<br>照片只存在你的裝置上，不會上傳。</p>
  </section>

  <!-- 拍照 -->
  <section class="screen" id="shoot">
    <div class="topbar">
      <button class="icon-btn" id="backHome" aria-label="回首頁">←</button>
      <div class="dots" id="shotDots"></div>
      <button class="icon-btn" id="flipBtn" aria-label="切換鏡頭">⟲</button>
    </div>
    <div class="booth">
      <div class="pv-wrap">
        <canvas id="out" width="640" height="480"></canvas>
        <div class="pv-msg" id="pvMsg"></div>
        <div class="countdown" id="countdown"></div>
        <div class="flash" id="flash"></div>
        <div class="rec" id="recTag">● REC</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="bg" class="on">背景</button>
      <button data-tab="shadow">陰影</button>
      <button data-tab="filter">濾鏡</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="thumbs" id="thumbs"></div>
    <p class="hint" id="shootHint"></p>
    <button class="btn big" id="nextBtn" hidden>下一步：裝飾 →</button>
    <button class="btn big" id="shootBtn">開始拍照</button>
  </section>

  <!-- 裝飾 -->
  <section class="screen" id="decorate">
    <div class="topbar">
      <button class="icon-btn" id="backShoot" aria-label="回去拍照">←</button>
      <span class="title">裝飾一下</span>
      <span style="width:42px"></span>
    </div>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <canvas id="decoCanvas"></canvas>
        <div class="sticker-layer" id="stickerLayer"></div>
      </div>
    </div>
    <div class="sel-tools" id="selTools" hidden>
      <button data-act="smaller">縮小</button>
      <button data-act="bigger">放大</button>
      <button data-act="rotate">轉一下</button>
      <button data-act="del" class="del">刪掉</button>
    </div>
    <div class="panel">
      <h3>相框顏色</h3>
      <div class="swatches" id="swatches"></div>
      <h3>印上日期 <label class="switch"><input type="checkbox" id="dateToggle" checked><span></span></label></h3>
      <h3>貼紙 <small>點一下貼上去，用手指拖著移動</small></h3>
      <div class="sticker-tray" id="tray"></div>
    </div>
    <button class="btn big" id="developBtn">好了，沖洗！</button>
  </section>

  <!-- 沖洗中 -->
  <section class="screen" id="develop">
    <div class="machine"><div class="slot"></div><div class="paper"></div></div>
    <p id="devText">機台正在沖洗照片…</p>
    <div class="bar"><i id="devBar"></i></div>
    <p class="note">動態拍貼要錄幾秒鐘，先別關掉這個畫面</p>
  </section>

  <!-- 結果 -->
  <section class="screen" id="result">
    <h2>沖好了！</h2>
    <div class="seg" id="resSeg">
      <button data-r="video" class="on">動態</button>
      <button data-r="photo">照片</button>
    </div>
    <div class="result-view">
      <video id="resVideo" playsinline muted loop autoplay></video>
      <img id="resImg" alt="拍貼成品" hidden>
    </div>
    <button class="btn" id="dlVideo">下載動態 MP4</button>
    <button class="btn alt" id="dlPng">下載照片 PNG</button>
    <button class="btn ghost" id="shareBtn" hidden>分享 / 存到相簿</button>
    <button class="btn ghost" id="againBtn">再拍一組</button>
    <p class="note" id="resNote"></p>
  </section>
</main>
<footer>MADE BY MAY22</footer>
<video id="cam" playsinline muted autoplay></video>
<div class="toast" id="toast"></div>

<script type="module">
/* ========== 設定 ========== */
const ENDPOINT = '';            // 填 Apps Script 網址就會記錄遊玩次數，留空不送
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite';
const FRAME_MS = 80;            // 動態每格間隔（約 12.5 fps）
const VS = 0.6;                 // 動態影片相對於照片的縮放

const LAYOUTS = {
  strip:  { n:4, cw:640, ch:480, cols:1, pad:44, gap:22, foot:170, sticker:.2 },
  grid:   { n:4, cw:480, ch:640, cols:2, pad:44, gap:22, foot:170, sticker:.13 },
  single: { n:1, cw:640, ch:800, cols:1, pad:44, gap:0,  foot:210, sticker:.16 },
};
const BGS = [
  { id:'leopard',  name:'豹紋',     shadow:'flash' },
  { id:'muslin',   name:'酒紅布幕', shadow:'soft'  },
  { id:'concrete', name:'橄欖綠牆', shadow:'soft'  },
  { id:'wood',     name:'木紋牆',   shadow:'flash' },
  { id:'mottled',  name:'藍色畫布', shadow:'soft'  },
  { id:'seamless', name:'灰背景紙', shadow:'soft'  },
  { id:'none',     name:'原本背景', shadow:'none'  },
];
const SHADOWS = [
  { id:'soft',  name:'柔光影',   k:16, mid:4, scale:1.05, dx:.03,  dy:.01,  alpha:.42 },
  { id:'flash', name:'閃光燈影', k:3,  mid:0, scale:1.0,  dx:.045, dy:.03,  alpha:.5  },
  { id:'none',  name:'不要陰影' },
];
const FILTERS = [
  { id:'orig',    name:'原片',     sat:1,   con:1,    grain:0 },
  { id:'flash',   name:'閃光燈',   sat:1.08,con:1.25, bri:14, b:4, grain:6 },
  { id:'film',    name:'暖黃底片', sat:1.05,con:1.05, r:14, g:6, b:-18, grain:9 },
  { id:'vintage', name:'復古褪色', sat:.75, con:.92,  lift:28, r:10, g:2, b:-12, grain:10 },
  { id:'cream',   name:'奶油柔光', sat:.92, con:.85,  bri:18, lift:12, r:6, b:2, grain:3 },
  { id:'cool',    name:'冷藍',     sat:.9,  con:1.04, r:-10, b:14, grain:4 },
  { id:'bw',      name:'黑白',     sat:0,   con:1.18, bri:4, grain:8 },
  { id:'grainy',  name:'顆粒感',   sat:.85, con:1.12, grain:28 },
  { id:'punch',   name:'高對比',   sat:1.2, con:1.4,  grain:2 },
];
FILTERS.forEach(f => f.lut = buildLut(f));
const FRAMES = [
  { id:'cream',   c:'#f4ecd8', ink:'#1b1b1b' },
  { id:'black',   c:'#121212', ink:'#f4ecd8' },
  { id:'red',     c:'#c8102e', ink:'#fff4e0' },
  { id:'navy',    c:'#1b2a55', ink:'#f4ecd8' },
  { id:'pink',    c:'#f6b8cb', ink:'#3a1020' },
  { id:'leopard', c:null,      ink:'#fff4e0' },
];

/* ========== 狀態 ========== */
const S = { layout:'strip', bg:'leopard', shadow:'flash', filter:'orig', frame:'cream', date:true,
  shots:[], sel:-1, cur:-1, busy:false, tab:'bg', facing:'user', stickers:[], selSticker:null };
const $ = id => document.getElementById(id);
const L = () => LAYOUTS[S.layout];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const even = x => Math.max(2, Math.round(x / 2) * 2);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function go(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));

    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r), c = colors[i % colors.length];
    g.addColorStop(0, hexA(c, amax * (.3 + .7 * R()))); g.addColorStop(1, hexA(c, 0));
    x.fillStyle = g; x.fillRect(cx - r, cy - r, r * 2, r * 2);

}
function lighting(x, w, h, cx, cy, glow, vig){
  const m = Math.max(w, h);

  g.addColorStop(0, `rgba(255,248,236,${glow})`); g.addColorStop(1, 'rgba(255,248,236,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  g = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .32, w / 2, h / 2, m * .78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${vig})`);
  x.fillStyle = g; x.fillRect(0, 0, w, h);
}
function addNoise(x, w, h, R, amt){
  const im = x.getImageData(0, 0, w, h), d = im.data;
  for(let i = 0; i < d.length; i += 4){ const n = (R() - .5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }

}
function ell(x, cx, cy, rx, ry, rot){ x.beginPath(); x.ellipse(cx, cy, Math.max(.5, rx), Math.max(.5, ry), rot, 0, Math.PI * 2); x.fill(); }

const BG_MAKERS = {
  muslin(w, h){
    const c = makeCanvas(w, h), x = c.getContext('2d'), R = rng(11);
    x.fillStyle = '#4a0e12'; x.fillRect(0, 0, w, h);
    blotch(x, w, h, R, 70, .08, .35, ['#7d1b20', '#2a0507', '#62141a'], .55);
    for(let i = 0; i < 18; i++){
      const fx = R() * w, fw = w * (.015 + R() * .05), a = .05 + R() * .08;
      const col = R() < .5 ? '255,215,215' : '0,0,0';
      const lg = x.createLinearGradient(fx - fw, 0, fx + fw, 0);
      lg.addColorStop(0, `rgba(${col},0)`); lg.addColorStop(.5, `rgba(${col},${a})`); lg.addColorStop(1, `rgba(${col},0)`);
      x.save(); x.translate(fx, 0); x.transform(1, 0, (R() - .5) * .15, 1, 0, 0); x.translate(-fx, 0);
      x.fillStyle = lg; x.fillRect(fx - fw, 0, fw * 2, h); x.restore();
    }
    lighting(x, w, h, .5, .38, .1, .6); addNoise(x, w, h, R, 10); return c;
  },
  concrete(w, h){
    const c = makeCanvas(w, h), x = c.getContext('2d'), R = rng(23);
    x.fillStyle = '#6a715f'; x.fillRect(0, 0, w, h);
    blotch(x, w, h, R, 140, .03, .22, ['#848c78', '#545a4b', '#8f947f', '#5f6656'], .4);
    const n = 400 * w * h / 307200, s = w / 640;
    for(let i = 0; i < n; i++){ x.fillStyle = hexA(R() < .5 ? '#3d4237' : '#a0a691', .25); x.fillRect(R() * w, R() * h, (1 + R() * 2) * s, (1 + R() * 2) * s); }
    lighting(x, w, h, .5, .4, .08, .5); addNoise(x, w, h, R, 22); return c;
  },
  wood(w, h){
    const c = makeCanvas(w, h), x = c.getContext('2d'), R = rng(37), s = w / 640;
    const a = hexRgb('#93603c'), b = hexRgb('#c99263'), step = Math.max(3, w / 50), knots = [];
    for(let i = 0; i <= w / step + 2; i++) knots.push(R());
    for(let xx = 0; xx < w; xx++){
      const t = xx / step, i0 = t | 0, f = t - i0, sm = f * f * (3 - 2 * f);
      let v = knots[i0] * (1 - sm) + knots[i0 + 1] * sm; v = v * .8 + R() * .2;
      x.fillStyle = `rgb(${a[0] + (b[0] - a[0]) * v | 0},${a[1] + (b[1] - a[1]) * v | 0},${a[2] + (b[2] - a[2]) * v | 0})`;

      const sx = w * p; x.fillStyle = 'rgba(50,25,10,.35)'; x.fillRect(sx, 0, 2 * s, h);

  mottled(w, h){

    blotch(x, w, h, R, 180, .02, .16, ['#7697c6', '#28436b', '#93afd4', '#1e3354', '#5677a8'], .5);
    lighting(x, w, h, .5, .45, .16, .55); addNoise(x, w, h, R, 12); return c;
  },
  seamless(w, h){

  leopard(w, h, plain){
    const c = makeCanvas(w, h), x = c.getContext('2d'), R = rng(67);

    blotch(x, w, h, R, 90, .04, .15, ['#d9b88c', '#a87b4d', '#b98c5c'], .45);
    const s = Math.min(Math.max(w, h) / 13, 60);
    x.lineCap = 'round';
    for(let gy = -1; gy * s * .82 < h + s; gy++) for(let gx = -1; gx * s < w + s; gx++){
      const cx = gx * s + (gy % 2 ? s / 2 : 0) + (R() - .5) * s * .45, cy = gy * s * .82 + (R() - .5) * s * .35;

function buildLut(f){
  const mk = off => { const a = new Uint8ClampedArray(256), lift = f.lift || 0;
    for(let v = 0; v < 256; v++){ let x = ((v / 255 - .5) * f.con + .5) * 255 + (f.bri || 0) + off; a[v] = lift + x * (1 - lift / 255); }
    return a; };

}
const NOISE = new Float32Array(65536).map(() => Math.random() - .5);
function applyFilter(x, w, h, f, composite){
  const grain = Math.max(f.grain, composite ? 5 : 0);
  if(f.id === 'orig' && !grain) return;
  const im = x.getImageData(0, 0, w, h), d = im.data, Lr = f.lut.r, Lg = f.lut.g, Lb = f.lut.b, sat = f.sat;
  const off = Math.random() * 65536 | 0;
  for(let i = 0, j = 0; i < d.length; i += 4, j++){
    let r = d[i], g = d[i + 1], b = d[i + 2];
    if(sat !== 1){ const l = .299 * r + .587 * g + .114 * b; r = l + (r - l) * sat; g = l + (g - l) * sat; b = l + (b - l) * sat; }
    const n = grain ? NOISE[(j + off) & 65535] * grain : 0;
    d[i]     = Lr[r < 0 ? 0 : r > 255 ? 255 : r | 0] + n;
    d[i + 1] = Lg[g < 0 ? 0 : g > 255 ? 255 : g | 0] + n;
    d[i + 2] = Lb[b < 0 ? 0 : b > 255 ? 255 : b | 0] + n;
  }
  x.putImageData(im, 0, 0);
}

  const W = out.width, H = out.height;
  sctx.save();
  if(S.facing === 'user'){ sctx.translate(W, 0); sctx.scale(-1, 1); }
  drawCover(sctx, video, video.videoWidth, video.videoHeight, W, H);
  sctx.restore();
  const useBg = S.bg !== 'none' && segReady;
  octx.globalCompositeOperation = 'source-over';
  if(useBg){
    updateMask();
    octx.drawImage(getBg(S.bg, W, H), 0, 0);
    drawShadow(W, H);
    pctx.globalCompositeOperation = 'copy'; pctx.drawImage(src, 0, 0);
    pctx.globalCompositeOperation = 'destination-in'; pctx.imageSmoothingEnabled = true; pctx.drawImage(maskC, 0, 0, W, H);
    pctx.globalCompositeOperation = 'source-over';
    octx.drawImage(person, 0, 0);
  }else{
    octx.drawImage(src, 0, 0);
  }
  applyFilter(octx, W, H, FILTERS.find(f => f.id === S.filter), useBg);
  recordTick();
}

/* ========== 錄動態 ========== */
let rec = null;
function startRec(){ rec = { frames:[], last:0 }; $('recTag').classList.add('on'); }
function recordTick(){
  if(!rec) return; const now = performance.now(); if(now - rec.last < FRAME_MS - 4) return; rec.last = now;
  const c = makeCanvas(Math.round(out.width * VS), Math.round(out.height * VS));
  c.getContext('2d').drawImage(out, 0, 0, c.width, c.height); rec.frames.push(c);
}
function stopRec(){ const f = rec ? rec.frames : []; rec = null; $('recTag').classList.remove('on'); return f; }

/* ========== 拍照畫面 UI ========== */
function showMsg(type, html){
  const el = $('pvMsg'); el.classList.toggle('on', !!html);
  el.innerHTML = html ? (type === 'spin' ? '<div><div class="spin"></div>' + html + '</div>' : '<div>' + html + '</div>') : '';
}
const needsSeg = () => S.bg !== 'none' && !segReady && !segFailed;

function renderChips(){
  const box = $('chips'); box.innerHTML = '';
  if(S.tab === 'bg'){
    BGS.forEach(b => {
      const el = document.createElement('button'); el.className = 'chip' + (S.bg === b.id ? ' on' : '');
      if(b.id === 'none'){ const sw = document.createElement('div'); sw.className = 'sw';
        sw.style.background = 'repeating-linear-gradient(45deg,#ddd 0 6px,#fff 6px 12px)'; el.appendChild(sw); }
      else { const c = makeCanvas(116, 88); c.getContext('2d').drawImage(getBg(b.id, 116, 88), 0, 0); el.appendChild(c); }
      el.append(b.name);
      el.onclick = () => {
        if(S.busy) return;
        if(b.id !== 'none' && segFailed){ toast('這台裝置換不了背景'); return; }
        S.bg = b.id; S.shadow = b.shadow; renderChips(); updateShootUI();
      };
      box.appendChild(el);
    });
  }else if(S.tab === 'shadow'){
    SHADOWS.forEach(s => {
      const el = document.createElement('button'); el.className = 'chip txt' + (S.shadow === s.id ? ' on' : ''); el.textContent = s.name;
      el.onclick = () => { if(S.bg === 'none'){ toast('換了背景才會有陰影'); return; } S.shadow = s.id; renderChips(); };
      box.appendChild(el);
    });
  }else{
    FILTERS.forEach(f => {
      const el = document.createElement('button'); el.className = 'chip txt' + (S.filter === f.id ? ' on' : ''); el.textContent = f.name;
      el.onclick = () => { S.filter = f.id; renderChips(); };
      box.appendChild(el);
    });
  }
}
$('tabs').onclick = e => {
  const b = e.target.closest('button'); if(!b) return;
  S.tab = b.dataset.tab; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); renderChips();
};

function renderThumbs(){
  const n = L().n, box = $('thumbs'), dots = $('shotDots'); box.innerHTML = ''; dots.innerHTML = '';
  for(let i = 0; i < n; i++){
    const shot = S.shots[i], el = document.createElement('button');
    el.className = 'thumb' + (shot ? ' filled' : '') + (S.sel === i ? ' sel' : '');
    if(shot){ const c = makeCanvas(124, 124), x = c.getContext('2d'); drawCover(x, shot.still, shot.still.width, shot.still.height, 124, 124); el.appendChild(c); }
    else el.textContent = i + 1;
    el.onclick = () => { if(S.busy || !shot) return; S.sel = S.sel === i ? -1 : i; renderThumbs(); updateShootUI(); };
    box.appendChild(el);
    const d = document.createElement('span'); d.textContent = i + 1;
    d.className = S.cur === i ? 'now' : shot ? 'done' : ''; dots.appendChild(d);
  }
}
function updateShootUI(){
  const n = L().n, filled = S.shots.filter(Boolean).length, all = filled === n;
  const btn = $('shootBtn'), next = $('nextBtn'), hint = $('shootHint');
  if(camOK) showMsg(needsSeg() ? 'spin' : '', needsSeg() ? '機台暖機中…<br>背景馬上就好' : '');
  btn.classList.remove('wait', 'ghost', 'alt');
  if(S.busy){ btn.textContent = S.cur >= 0 ? `拍攝中 ${S.cur + 1} / ${n}` : '拍攝中'; btn.classList.add('wait'); next.hidden = true; hint.textContent = '看鏡頭！'; }
  else if(needsSeg() || !camOK){ btn.textContent = camOK ? '暖機中…' : '等待鏡頭'; btn.classList.add('wait'); next.hidden = true;
    hint.textContent = camOK ? '第一次要下載去背模型，等幾秒就好' : ''; }
  else if(all && S.sel >= 0){ btn.textContent = `重拍第 ${S.sel + 1} 張`; next.hidden = true; hint.textContent = '再點一次照片可以取消'; }
  else if(all){ btn.textContent = n > 1 ? '全部重拍' : '重拍'; btn.classList.add('ghost'); next.hidden = false;
    hint.textContent = n > 1 ? '不滿意哪張，點它就能單獨重拍' : ''; }
  else { btn.textContent = filled ? '繼續拍' : (n > 1 ? `開始拍照（連拍 ${n} 張）` : '開始拍照'); next.hidden = true;
    hint.textContent = '按下去會倒數 3 秒'; }
  renderThumbs();
}

async function shootOne(i){
  const cd = $('countdown');
  for(const n of [3, 2, 1]){
    cd.textContent = n; cd.classList.remove('tick'); void cd.offsetWidth; cd.classList.add('tick');
    beep(n === 1 ? 880 : 660); if(n === 1) startRec();
    await sleep(1000);
  }
  cd.textContent = '';
  const still = makeCanvas(out.width, out.height); still.getContext('2d').drawImage(out, 0, 0);
  const fl = $('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); shutterSound();
  await sleep(600);
  let clip = stopRec();
  if(!clip.length){ const c = makeCanvas(Math.round(still.width * VS), Math.round(still.height * VS)); c.getContext('2d').drawImage(still, 0, 0, c.width, c.height); clip = [c]; }
  S.shots[i] = { still, clip };
}
$('shootBtn').onclick = async () => {
  if(S.busy) return; ensureAudio();
  if(!camOK){ startCam(); return; }
  if(needsSeg()){ toast('背景還在準備，等一下下'); return; }
  const n = L().n, filled = S.shots.filter(Boolean).length;
  let idx;
  if(S.sel >= 0) idx = [S.sel];
  else if(filled === n){ S.shots = []; idx = [...Array(n).keys()]; }
  else idx = [...Array(n).keys()].filter(i => !S.shots[i]);
  S.busy = true; S.sel = -1;
  for(const i of idx){ S.cur = i; updateShootUI(); await shootOne(i); S.cur = -1; updateShootUI(); await sleep(500); }
  S.busy = false; S.cur = -1; updateShootUI();
  if(S.shots.filter(Boolean).length === n) track('shoot_done', S.bg + '/' + S.filter);
};
$('nextBtn').onclick = enterDecorate;
$('flipBtn').onclick = () => { if(S.busy) return; S.facing = S.facing === 'user' ? 'environment' : 'user'; startCam(); };
$('backHome').onclick = () => { if(S.busy) return; stopLoop(); stopCam(); go('home'); };

/* ========== 首頁 ========== */
document.querySelectorAll('.layout-card').forEach(c => c.onclick = () => {
  S.layout = c.dataset.layout; document.querySelectorAll('.layout-card').forEach(x => x.classList.toggle('on', x === c));
});
$('startBtn').onclick = () => {
  ensureAudio(); S.shots = []; S.sel = -1; S.stickers = []; S.selSticker = null;
  setupCanvases(); go('shoot'); renderChips(); updateShootUI(); startCam(); startLoop();
  if(!seg && !segFailed && !window.__segLoading){ window.__segLoading = true; loadSegmenter(); }
  track('start', S.layout);
};

/* ========== 成品排版 ========== */
function geom(){
  const l = L(), rows = Math.ceil(l.n / l.cols);
  const W = l.pad * 2 + l.cols * l.cw + (l.cols - 1) * l.gap;
  const H = l.pad + rows * l.ch + (rows - 1) * l.gap + l.foot;
  const cells = [];
  for(let i = 0; i < l.n; i++){ const c = i % l.cols, r = i / l.cols | 0;
    cells.push({ x: l.pad + c * (l.cw + l.gap), y: l.pad + r * (l.ch + l.gap), w: l.cw, h: l.ch }); }
  return { W, H, cells, foot: l.foot };
}
function boom(i, n){ if(n < 2) return 0; const p = 2 * n - 2, m = i % p; return m < n ? m : p - m; }
function dateStr(){ const d = new Date(), p = v => String(v).padStart(2, '0'); return `${d.getFullYear()}.${p(d.getMonth() + 1)}.${p(d.getDate())}`; }

function compose(x, G, opt = {}){
  const fr = FRAMES.find(f => f.id === S.frame), { W, H } = G;
  if(fr.c){ x.fillStyle = fr.c; x.fillRect(0, 0, W, H); }
  else x.drawImage(getBg('leopard', even(W * .5), even(H * .5), true), 0, 0, W, H);
  G.cells.forEach((c, i) => {
    const shot = S.shots[i];
    if(!shot){ x.fillStyle = '#888'; x.fillRect(c.x, c.y, c.w, c.h); return; }
    const img = opt.frameIdx == null ? shot.still : shot.clip[boom(opt.frameIdx, shot.clip.length)];
    x.drawImage(img, c.x, c.y, c.w, c.h);
  });
  // 底部文字
  const fy = H - G.foot, cx = W / 2;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = fr.ink;
  const leo = fr.id === 'leopard';
  const txt = (t, y) => { if(leo){ x.lineWidth = 6; x.strokeStyle = '#1b1b1b'; x.lineJoin = 'round'; x.strokeText(t, cx, y); } x.fillText(t, cx, y); };
  if(S.date){
    x.font = '72px VT323, monospace'; txt(dateStr(), fy + G.foot * .42);
    x.font = '26px "Archivo Black", sans-serif'; txt('★ PHOTO-MATIC ★', fy + G.foot * .74);
  }else{
    x.font = '36px "Archivo Black", sans-serif'; txt('★ PHOTO-MATIC ★', fy + G.foot * .5);
  }
  if(opt.stickers) S.stickers.forEach(s => {
    const c = stickerCanvas(s.type), w = s.size * W, h = w * c.height / c.width;
    x.save(); x.translate(s.x * W, s.y * H); x.rotate(s.rot); x.imageSmoothingEnabled = false;
    x.drawImage(c, -w / 2, -h / 2, w, h); x.restore();
  });
}

/* ========== 裝飾畫面 ========== */
let previewT = 0;
function sizeStage(){
  const G = geom(), maxW = Math.min($('stageWrap').clientWidth, 480), maxH = innerHeight * .58;
  let w = maxW, h = w * G.H / G.W; if(h > maxH){ h = maxH; w = h * G.W / G.H; }
  $('stage').style.width = w + 'px'; $('stage').style.height = h + 'px';
  const c = $('decoCanvas'); c.width = even(G.W * VS); c.height = even(G.H * VS);
}
function startPreview(){
  clearInterval(previewT);
  const G = geom(), c = $('decoCanvas'), x = c.getContext('2d'); let i = 0;
  const draw = () => { x.setTransform(c.width / G.W, 0, 0, c.height / G.H, 0, 0); compose(x, G, { frameIdx: i++ }); };
  draw(); previewT = setInterval(draw, FRAME_MS);
}
function enterDecorate(){
  stopLoop(); go('decorate'); sizeStage(); startPreview(); renderSwatches(); renderTray(); renderStickers();
  Promise.all([document.fonts.load('72px VT323'), document.fonts.load('26px "Archivo Black"')]).catch(() => {});
}
$('backShoot').onclick = () => { clearInterval(previewT); go('shoot'); updateShootUI(); startLoop(); };
addEventListener('resize', () => { if($('decorate').classList.contains('active')) sizeStage(); });

function renderSwatches(){
  const box = $('swatches'); box.innerHTML = '';
  FRAMES.forEach(f => {
    const el = document.createElement('button'); el.className = 'swatch' + (S.frame === f.id ? ' on' : '');
    el.style.background = f.c || `url(${getBg('leopard', 80, 80, true).toDataURL()}) center/cover`;
    el.setAttribute('aria-label', f.id);
    el.onclick = () => { S.frame = f.id; renderSwatches(); };
    box.appendChild(el);
  });
}
$('dateToggle').onchange = e => { S.date = e.target.checked; };
function renderTray(){
  const box = $('tray'); if(box.children.length) return;
  STICKERS.forEach(s => {
    const el = document.createElement('button'), img = new Image(); img.src = stickerURL(s.id); el.appendChild(img);
    el.onclick = () => {
      const st = { type: s.id, x: .5 + (Math.random() - .5) * .3, y: .4 + (Math.random() - .5) * .3, size: L().sticker, rot: (Math.random() - .5) * .4 };
      S.stickers.push(st); S.selSticker = st; renderStickers();
    };
    box.appendChild(el);
  });
}
function place(el, s){
  el.style.left = s.x * 100 + '%'; el.style.top = s.y * 100 + '%'; el.style.width = s.size * 100 + '%';
  el.style.transform = `translate(-50%,-50%) rotate(${s.rot}rad)`;
}
function renderStickers(){
  const layer = $('stickerLayer'); layer.innerHTML = '';
  S.stickers.forEach(s => {
    const el = document.createElement('img'); el.src = stickerURL(s.type); el.draggable = false;
    el.className = 'stk' + (s === S.selSticker ? ' sel' : ''); place(el, s);
    el.onpointerdown = e => {
      e.preventDefault(); e.stopPropagation();
      if(S.selSticker !== s){ S.selSticker = s; layer.querySelectorAll('.stk').forEach(x => x.classList.remove('sel')); el.classList.add('sel'); $('selTools').hidden = false; }
      const r = layer.getBoundingClientRect(), ox = e.clientX - s.x * r.width, oy = e.clientY - s.y * r.height;
      el.setPointerCapture(e.pointerId);
      el.onpointermove = ev => { s.x = clamp((ev.clientX - ox) / r.width, 0, 1); s.y = clamp((ev.clientY - oy) / r.height, 0, 1); place(el, s); };
      el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; };
    };
    layer.appendChild(el);
  });
  $('selTools').hidden = !S.selSticker;
}
$('stickerLayer').onpointerdown = e => { if(e.target.id === 'stickerLayer' && S.selSticker){ S.selSticker = null; renderStickers(); } };
$('selTools').onclick = e => {
  const b = e.target.closest('button'), s = S.selSticker; if(!b || !s) return;
  const a = b.dataset.act;
  if(a === 'bigger') s.size = Math.min(.7, s.size * 1.2);
  if(a === 'smaller') s.size = Math.max(.05, s.size / 1.2);
  if(a === 'rotate') s.rot += Math.PI / 12;
  if(a === 'del'){ S.stickers = S.stickers.filter(x => x !== s); S.selSticker = null; }
  renderStickers();
};

/* ========== 沖洗與輸出 ========== */
let pngBlob = null, vid = null;
function setDev(p, t){ $('devBar').style.width = Math.round(p * 100) + '%'; if(t) $('devText').textContent = t; }
function pickMime(){
  if(!window.MediaRecorder) return null;
  const list = ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
  for(const m of list) if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
async function recordVideo(G, onp){
  const mime = pickMime(); if(mime === null) return null;
  const c = makeCanvas(even(G.W * VS), even(G.H * VS)); if(!c.captureStream) return null;
  const x = c.getContext('2d');
  const draw = i => { x.setTransform(c.width / G.W, 0, 0, c.height / G.H, 0, 0); compose(x, G, { frameIdx: i, stickers: true }); };
  const maxLen = Math.max(...S.shots.map(s => s.clip.length)), period = Math.max(2, 2 * maxLen - 2);
  const total = Math.max(period * 2, Math.ceil(3000 / FRAME_MS));
  draw(0);
  const stream = c.captureStream(30);
  let recd;
  try{ recd = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 6e6 } : { videoBitsPerSecond: 6e6 }); }
  catch(e){ recd = new MediaRecorder(stream); }
  const chunks = []; recd.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => recd.onstop = r);
  recd.start(250);
  const t0 = performance.now();
  for(let i = 0; i <= total; i++){
    draw(i); onp(i / total);
    const wait = t0 + (i + 1) * FRAME_MS - performance.now(); if(wait > 0) await sleep(wait);
  }
  recd.stop(); await stopped; stream.getTracks().forEach(t => t.stop());
  const type = recd.mimeType || mime || 'video/webm';
  if(!chunks.length) return null;
  return { blob: new Blob(chunks, { type }), ext: type.includes('mp4') ? 'mp4' : 'webm' };
}
$('developBtn').onclick = async () => {
  clearInterval(previewT); S.selSticker = null; go('develop'); setDev(0, '機台正在沖洗照片…');
  try{ await Promise.all([document.fonts.load('72px VT323'), document.fonts.load('26px "Archivo Black"')]); }catch(e){}
  const G = geom(), full = makeCanvas(G.W, G.H); compose(full.getContext('2d'), G, { stickers: true });
  pngBlob = await new Promise(r => full.toBlob(r, 'image/png'));
  setDev(.15, '把動態錄進底片裡…');
  try{ vid = await recordVideo(G, p => setDev(.15 + p * .85)); }catch(e){ console.warn(e); vid = null; }
  setDev(1, '好了！'); await sleep(300);
  showResult(); track('develop', S.layout);
};
function showResult(){
  go('result');
  const v = $('resVideo'), img = $('resImg');
  if(img.src) URL.revokeObjectURL(img.src); img.src = URL.createObjectURL(pngBlob);
  if(v.src) URL.revokeObjectURL(v.src);
  if(vid){ v.src = URL.createObjectURL(vid.blob); v.play().catch(() => {}); }
  $('dlVideo').hidden = !vid; $('resSeg').style.display = vid ? '' : 'none';
  $('dlVideo').textContent = vid ? `下載動態 ${vid.ext.toUpperCase()}` : '';
  $('resNote').innerHTML = !vid ? '這個瀏覽器沒辦法錄影片，照片還是可以下載。'
    : vid.ext !== 'mp4' ? '這個瀏覽器只能存成 WebM。想要 MP4 的話，換手機 Safari 或新版 Chrome 開。' : '動態檔可以直接發 IG 限動。';
  setResView(vid ? 'video' : 'photo');
  $('shareBtn').hidden = !(navigator.canShare && navigator.canShare({ files:[new File([pngBlob], 'x.png', { type:'image/png' })] }));
}
function setResView(r){
  [...$('resSeg').children].forEach(b => b.classList.toggle('on', b.dataset.r === r));
  $('resVideo').hidden = r !== 'video'; $('resImg').hidden = r !== 'photo';
  $('resSeg').dataset.view = r;
}
$('resSeg').onclick = e => { const b = e.target.closest('button'); if(b) setResView(b.dataset.r); };
const fname = ext => `photomatic-${dateStr().replaceAll('.', '')}.${ext}`;
function download(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
$('dlPng').onclick = () => { download(pngBlob, fname('png')); track('download', 'png'); };
$('dlVideo').onclick = () => { if(vid){ download(vid.blob, fname(vid.ext)); track('download', vid.ext); } };
$('shareBtn').onclick = async () => {
  const useVid = $('resSeg').dataset.view === 'video' && vid;
  const file = useVid ? new File([vid.blob], fname(vid.ext), { type: vid.blob.type }) : new File([pngBlob], fname('png'), { type:'image/png' });
  try{
    if(navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); track('share', useVid ? 'video' : 'png'); }
    else toast('這個檔案不能直接分享，請用下載');
  }catch(e){}
};
$('againBtn').onclick = () => { stopCam(); go('home'); };
</script>
